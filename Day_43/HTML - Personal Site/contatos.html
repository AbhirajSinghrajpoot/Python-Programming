<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Contacts</title>
</head>
<body>
    <h3>My Sample Contacts</h3>
    <p>My sample address</p>
    <p>(00) 00000-0000</p>
    <p>myemail@gmail.com</p>
    <hr size="2">
    <form action="mailto:info@thiagomonteiro.com" method="post" enctype="text/plain">
        <label>Your Name:</label>
        <label type="text" name="YourName" value=""><br>
        <label for="your-email">Your Email:</label>
        <input type="email" id="your-email" name="YourEmail" value=""><br>
        <label for="your-message">Your message:</label><br>
        <textarea id="your-message" name="YourMessage" rows="10" cols="30" placeholder="Type your message here"></textarea><br>
        <input type="submit" value="Send">
    </form>
</body>
</html>
